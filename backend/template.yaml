AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Momente wedding photo API

Parameters:
  AllowedOrigin:
    Type: String
    Description: Exact HTTPS origin of the production frontend
  EventId:
    Type: String
    Default: enis-agnesa-2026
  GalleryClosesAt:
    Type: String
    Default: "2026-08-11T21:59:59Z"
  EmergencyBudgetUSD:
    Type: Number
    Default: 20
    MinValue: 1
  BudgetEmail:
    Type: String
    Default: shkurtiedda@gmail.com
  PhotoRetentionDays:
    Type: Number
    Default: 90
    MinValue: 30

Globals:
  Function:
    Runtime: python3.12
    CodeUri: src/
    MemorySize: 256
    Timeout: 15
    Tracing: Active
    Environment:
      Variables:
        TABLE_NAME: !Ref PhotoTable
        BUCKET_NAME: !Ref PhotoBucket
        EVENT_ID: !Ref EventId
        GALLERY_CLOSES_AT: !Ref GalleryClosesAt
        ALLOWED_ORIGIN: !Ref AllowedOrigin
        IMAGE_BASE_URL: !Sub "https://${PhotoDistribution.DomainName}"
        DISTRIBUTION_ID: !Ref PhotoDistribution
        FRONTEND_DISTRIBUTION_ID: !Ref FrontendDistribution
  HttpApi:
    CorsConfiguration:
      AllowOrigins:
        - !Ref AllowedOrigin
      AllowHeaders:
        - authorization
        - content-type
      AllowMethods:
        - GET
        - POST
        - DELETE
        - OPTIONS
      MaxAge: 600

Resources:
  MomenteApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: "$default"
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10
      Auth:
        Authorizers:
          OrganizerAuthorizer:
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${OrganizerUserPool}"
              audience:
                - !Ref OrganizerUserPoolClient
            IdentitySource: "$request.header.Authorization"

  PhotoBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - !Ref AllowedOrigin
            AllowedMethods:
              - PUT
              - GET
            AllowedHeaders:
              - "*"
            ExposedHeaders:
              - ETag
            MaxAge: 600
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
          - Id: ExpireOriginalPhotos
            Status: Enabled
            Prefix: originals/
            ExpirationInDays: !Ref PhotoRetentionDays
          - Id: ExpireOptimizedPhotos
            Status: Enabled
            Prefix: optimized/
            ExpirationInDays: !Ref PhotoRetentionDays

  PhotoOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "momente-${AWS::StackName}-photos"
        Description: Private access to optimized Momente photos
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  PhotoResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "momente-${AWS::StackName}-photo-cors"
        CorsConfig:
          AccessControlAllowCredentials: false
          AccessControlAllowHeaders:
            Items:
              - "*"
          AccessControlAllowMethods:
            Items:
              - GET
              - HEAD
              - OPTIONS
          AccessControlAllowOrigins:
            Items:
              - !Ref AllowedOrigin
          AccessControlExposeHeaders:
            Items:
              - ETag
          AccessControlMaxAgeSec: 600
          OriginOverride: true
        SecurityHeadersConfig:
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: no-referrer
            Override: true

  PhotoDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Momente optimized wedding photos
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Origins:
          - Id: PhotoBucketOrigin
            DomainName: !GetAtt PhotoBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt PhotoOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: PhotoBucketOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref PhotoResponseHeadersPolicy
          Compress: true

  PhotoBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PhotoBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontOptimizedPhotoReads
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${PhotoBucket.Arn}/optimized/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${PhotoDistribution}"

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "momente-${AWS::StackName}-frontend"
        Description: Private access to the Momente React frontend
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Momente live React frontend
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Origins:
          - Id: FrontendBucketOrigin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: FrontendBucketOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          Compress: true
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontFrontendReads
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}"

  PhotoTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: ByPhotoId
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  OrganizerUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "momente-${EventId}-organizers"
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true

  OrganizerUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref OrganizerUserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  CreateUploadUrlsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.create_upload_urls.handler
      Policies:
        - S3WritePolicy:
            BucketName: !Ref PhotoBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref PhotoTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref MomenteApi
            Path: /api/events/{eventId}/uploads/presign
            Method: POST

  CreateSubmissionFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.create_submission.handler
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref PhotoBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref PhotoTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref MomenteApi
            Path: /api/events/{eventId}/submissions
            Method: POST

  ListPhotosFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.list_photos.handler
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref PhotoBucket
        - DynamoDBReadPolicy:
            TableName: !Ref PhotoTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref MomenteApi
            Path: /api/events/{eventId}/photos
            Method: GET

  DownloadPhotoFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.get_download_url.handler
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref PhotoBucket
        - DynamoDBReadPolicy:
            TableName: !Ref PhotoTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref MomenteApi
            Path: /api/events/{eventId}/photos/{photoId}/download
            Method: POST

  DeletePhotoFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.delete_photo.handler
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref PhotoBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref PhotoTable
        - Statement:
            - Effect: Allow
              Action:
                - cloudfront:CreateInvalidation
              Resource: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${PhotoDistribution}"
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref MomenteApi
            Path: /api/admin/events/{eventId}/photos/{photoId}
            Method: DELETE
            Auth:
              Authorizer: OrganizerAuthorizer

  ShutdownTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AWS::StackName}-budget-shutdown"

  ShutdownTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref ShutdownTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowAWSBudgets
            Effect: Allow
            Principal:
              Service: budgets.amazonaws.com
            Action: sns:Publish
            Resource: !Ref ShutdownTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:budgets::${AWS::AccountId}:*"

  ShutdownAppFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.shutdown_app.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PhotoTable
        - Statement:
            - Effect: Allow
              Action:
                - cloudfront:CreateInvalidation
                - cloudfront:GetDistributionConfig
                - cloudfront:UpdateDistribution
              Resource:
                - !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${PhotoDistribution}"
                - !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}"
      Events:
        BudgetNotification:
          Type: SNS
          Properties:
            Topic: !Ref ShutdownTopic

  SetAppStateFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.set_app_state.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PhotoTable
        - Statement:
            - Effect: Allow
              Action:
                - cloudfront:GetDistributionConfig
                - cloudfront:UpdateDistribution
              Resource:
                - !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${PhotoDistribution}"
                - !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}"

  EmergencyCostBudget:
    Type: AWS::Budgets::Budget
    DependsOn: ShutdownTopicPolicy
    Properties:
      Budget:
        BudgetName: Momente-Emergency-Stop
        BudgetLimit:
          Amount: !Ref EmergencyBudgetUSD
          Unit: USD
        BudgetType: COST
        TimeUnit: MONTHLY
        CostTypes:
          IncludeCredit: false
          IncludeDiscount: true
          IncludeOtherSubscription: true
          IncludeRecurring: true
          IncludeRefund: false
          IncludeSubscription: true
          IncludeSupport: true
          IncludeTax: true
          IncludeUpfront: true
          UseAmortized: false
          UseBlended: false
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref ShutdownTopic
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail

Outputs:
  ApiBaseUrl:
    Value: !Sub "https://${MomenteApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
  PhotoBucketName:
    Value: !Ref PhotoBucket
  PhotoTableName:
    Value: !Ref PhotoTable
  OrganizerUserPoolId:
    Value: !Ref OrganizerUserPool
  OrganizerUserPoolClientId:
    Value: !Ref OrganizerUserPoolClient
  OptimizedPhotoBaseUrl:
    Value: !Sub "https://${PhotoDistribution.DomainName}"
  ShutdownTopicArn:
    Value: !Ref ShutdownTopic
  SetAppStateFunctionName:
    Value: !Ref SetAppStateFunction
  FrontendBucketName:
    Value: !Ref FrontendBucket
  FrontendDistributionId:
    Value: !Ref FrontendDistribution
  FrontendUrl:
    Value: !Sub "https://${FrontendDistribution.DomainName}"
